<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin-Zugang wiederherstellen – TechParts 3D</title>
  <style>
    :root { color-scheme: light; --ink:#172b2e; --muted:#5d6b6e; --line:#dce4e2; --accent:#294448; --bg:#f5f7f5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,480px); background:#fff; border:1px solid var(--line); border-radius:18px; padding:clamp(24px,5vw,40px); box-shadow:0 12px 35px #172b2e0d; }
    .eyebrow { margin:0 0 8px; color:var(--muted); font-size:.78rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:0 0 10px; font-size:clamp(1.5rem,4vw,2rem); line-height:1.2; }
    p { color:var(--muted); margin:0 0 20px; }
    label { display:block; margin:16px 0 6px; font-weight:650; }
    input { display:block; width:100%; padding:12px 13px; border:1px solid #aebdb9; border-radius:9px; font:inherit; color:var(--ink); background:#fff; }
    input:focus { outline:3px solid #2944482b; border-color:var(--accent); }
    button,.button-link { display:inline-block; width:100%; margin-top:20px; padding:12px 16px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:700; text-align:center; text-decoration:none; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .message { padding:12px 14px; border-radius:9px; background:#f0f4f2; color:var(--ink); margin:18px 0 0; overflow-wrap:anywhere; }
    .message.error { background:#fff0ed; color:#7b241c; }
    [hidden] { display:none !important; }
    .small { font-size:.9rem; margin-top:18px; margin-bottom:0; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">TechParts 3D · Admin</p>
    <h1>Admin-Zugang wiederherstellen</h1>
    <p>Gib die E-Mail-Adresse ein, mit der du dich in der TechParts3D-Adminseite anmeldest. Wir senden eine Wiederherstellungs-E-Mail, falls diese Adresse zu einem Konto gehört.</p>
    <form id="requestForm">
      <label for="email">Admin-E-Mail-Adresse</label>
      <input id="email" type="email" autocomplete="email" required>
      <button id="sendButton" type="submit">Wiederherstellungs-E-Mail senden</button>
    </form>
    <div id="message" class="message" role="status" hidden></div>
    <div id="errorMessage" class="message error" role="alert" hidden></div>
    <p class="small"><a href="./admin.html">Zurück zur Admin-Anmeldung</a></p>
  </main>
  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const RECOVERY_URL = 'https://milamaiorova2026.github.io/techparts-3d/reset-password.html';
    const client = createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim());
    const form = document.querySelector('#requestForm');
    const emailInput = document.querySelector('#email');
    const sendButton = document.querySelector('#sendButton');
    const message = document.querySelector('#message');
    const errorMessage = document.querySelector('#errorMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      sendButton.disabled = true;
      message.hidden = true;
      errorMessage.hidden = true;
      const email = emailInput.value.trim();
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: RECOVERY_URL });
      sendButton.disabled = false;
      if (error) {
        errorMessage.textContent = 'Die Anfrage konnte nicht gesendet werden. Bitte prüfe die Supabase-Einstellungen und versuche es später erneut.';
        errorMessage.hidden = false;
        console.error('Password recovery request failed:', error);
        return;
      }
      message.textContent = 'Falls diese E-Mail-Adresse zu einem Benutzerkonto gehört, wurde eine Wiederherstellungs-E-Mail angefordert. Prüfe den Posteingang und den Spam-Ordner. Öffne den Link nur einmal und auf diesem Gerät.';
      message.hidden = false;
      form.hidden = true;
    });
  </script>
</body>
</html>
